<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10051f">
<title>SK SONG AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:18px;
 background:#090411;
 color:white;
 font-family:Arial,sans-serif;
}
.app{max-width:650px;margin:auto}
header{text-align:center;padding:20px 5px}
.logo{
 display:inline-block;
 padding:18px;
 border-radius:22px;
 background:linear-gradient(135deg,#923cff,#f12bd6);
 font-size:35px
}
h1{font-size:35px;margin:12px 0}
p{color:#c8b8d8;line-height:1.7}
.card{
 background:#170b25;
 border:1px solid #59236f;
 border-radius:24px;
 padding:20px;
 margin:18px 0
}
label{
 display:block;
 margin:18px 0 8px;
 font-weight:bold
}
textarea,select,input{
 width:100%;
 padding:14px;
 background:#0c0614;
 color:white;
 border:1px solid #633079;
 border-radius:13px;
 font-size:16px
}
textarea{min-height:120px}
button,.download{
 display:block;
 width:100%;
 margin-top:20px;
 padding:16px;
 border:0;
 border-radius:14px;
 background:linear-gradient(100deg,#923cff,#f12bd6);
 color:white;
 font-size:17px;
 font-weight:bold;
 text-align:center;
 text-decoration:none
}
button:disabled{opacity:.6}
#status{color:#55e6b0;margin-top:15px}
audio{width:100%;margin-top:15px}
.note{
 padding:14px;
 border:1px solid #59236f;
 border-radius:14px;
 margin-top:20px;
 color:#c8b8d8
}
footer{text-align:center;color:#a996b7;margin:30px 0}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="logo">🎵</div>
 <h1>SK SONG AI</h1>
 <p>Ka rubuta abin da kake so, ka tsara waƙarka.</p>
</header>

<section class="card">
 <h2>🎙️ Ƙirƙiri waƙa</h2>

 <form id="songForm">

  <label for="prompt">Bayanin waƙa (Prompt)</label>
  <textarea id="prompt" required
  placeholder="Misali: Waƙar soyayya ta Hausa, muryar namiji, Afro-pop mai daɗi..."></textarea>

  <label for="style">Salon waƙa</label>
  <select id="style">
   <option>Afro-pop</option>
   <option>Hausa traditional</option>
   <option>Afrobeats</option>
   <option>R&B</option>
   <option>Hip-hop / Rap</option>
   <option>Gospel</option>
   <option>Slow love song</option>
  </select>

  <label for="language">Harshen waƙa</label>
  <select id="language">
   <option>Hausa</option>
   <option>English</option>
   <option>Hausa da English</option>
  </select>

  <label for="voice">Irin murya</label>
  <select id="voice">
   <option>Muryar namiji</option>
   <option>Muryar mace</option>
   <option>Namiji da mace</option>
   <option>AI ya zaɓa</option>
  </select>

  <label for="duration">Tsawon waƙa</label>
  <select id="duration">
   <option value="60">Minti 1</option>
   <option value="180">Minti 3</option>
   <option value="600">Minti 10</option>
  </select>

  <label for="voiceFile">Loda muryarka (na zaɓi)</label>
  <input id="voiceFile" type="file" accept="audio/*">

  <button id="generateBtn" type="submit">
   🎶 Samar da waƙa
  </button>

 </form>

 <div id="status"></div>

 <div id="result" hidden>
  <h2>🎧 Waƙarka</h2>
  <audio id="player" controls></audio>
  <a id="download" class="download" download="sk-song-ai.mp3">
   ⬇️ Sauke waƙa
  </a>
 </div>

 <div class="note">
  <b>Bayani:</b>
  Domin samar da ainihin waƙa mai sauti, dole ne a haɗa
  wannan shafin da AI music API ta hanyar backend mai tsaro.
 </div>
</section>

<footer>SK SONG AI · © 2026</footer>
</div>

<script>
/*
  MUHIMMI:
  Sai an haɗa backend da AI music API kafin wannan
  maɓallin ya iya samar da ainihin waƙa.

  Kada a saka sirrin API key a cikin wannan HTML.
*/

const API_ENDPOINT = "/api/generate-song";

document.getElementById("songForm").addEventListener("submit",
async function(event){

 event.preventDefault();

 const status = document.getElementById("status");
 const button = document.getElementById("generateBtn");

 const data = new FormData();

 data.append("prompt",
 document.getElementById("prompt").value);

 data.append("style",
 document.getElementById("style").value);

 data.append("language",
 document.getElementById("language").value);

 data.append("voice",
 document.getElementById("voice").value);

 data.append("duration",
 document.getElementById("duration").value);

 const file = document.getElementById("voiceFile").files[0];

 if(file){
  data.append("voiceFile",file);
 }

 button.disabled = true;
 button.textContent = "Ana ƙoƙarin samarwa...";
 status.textContent = "";

 try{

  const response = await fetch(API_ENDPOINT,{
   method:"POST",
   body:data
  });

  if(!response.ok){
   throw new Error("Ba a haɗa AI music backend ba tukuna.");
  }

  const type = response.headers.get("content-type") || "";
  let audioURL;

  if(type.includes("application/json")){

   const result = await response.json();

   if(!result.audioUrl){
    throw new Error("Ba a samu fayil ɗin waƙa ba.");
   }

   audioURL = result.audioUrl;

  }else if(type.startsWith("audio/")){

   audioURL = URL.createObjectURL(await response.blob());

  }else{

   throw new Error("Amsar ba ta ƙunshi sautin waƙa ba.");

  }

  document.getElementById("player").src = audioURL;
  document.getElementById("download").href = audioURL;
  document.getElementById("result").hidden = false;

  status.textContent = "An samu waƙa! Danna play domin sauraro.";

 }catch(error){

  status.textContent =
   "AI music API da backend suna buƙatar haɗawa kafin samar da waƙa.";

 }finally{

  button.disabled = false;
  button.textContent = "🎶 Samar da waƙa";

 }

});
</script>
</body>
</html>
